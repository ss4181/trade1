name: Trade1 cloud scanner

# GitHub scheduled workflows kesin zamanlayici DEGILDIR. */5 yalniz hedef
# sikliktir; yogunlukta calisma dakikalar/saatler gecikebilir. Bu is tablet
# tarayicisinin 5 dakikalik SLA'si degil, best-effort yedektir.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send a clearly labelled Telegram test message
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: trade1-cloud-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_BOT_ID }}
      TELEGRAM_COMMANDS: "false"
      DASHBOARD_ENABLED: "false"
      DAILY_SUMMARY_HOUR_UTC: "-1"
      ARCHIVE_MARKET_DATA: "false"
      PROJECT_HUB_INGEST_URL: ${{ secrets.PROJECT_HUB_INGEST_URL }}
      PROJECT_HUB_INGEST_TOKEN: ${{ secrets.PROJECT_HUB_INGEST_TOKEN }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
    steps:
      - name: Check out Trade1
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore edge-trigger and cooldown state
        uses: actions/cache@v4
        with:
          path: |
            .bot_state.json
            signals.log
            .perf_cache.json
            .subscribers.json
          key: trade1-cloud-state-${{ github.run_id }}
          restore-keys: |
            trade1-cloud-state-

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Send Telegram connection test
        if: ${{ inputs.telegram_test == true }}
        run: python signal_bot.py --test-notify

      - name: Scan the validated universe once
        run: python signal_bot.py --once

      - name: Report successful scan to Serhan Lab
        if: ${{ success() }}
        run: python cloud_report.py

      - name: Report failed scan to Serhan Lab
        if: ${{ failure() }}
        run: python cloud_report.py --failed
