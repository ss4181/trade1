name: Hyperliquid standalone tests

on:
  push:
    paths: ['hyperliquid_bot/**', '.github/workflows/hyperliquid-tests.yml']
  pull_request:
    paths: ['hyperliquid_bot/**', '.github/workflows/hyperliquid-tests.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r hyperliquid_bot/requirements.txt
      - run: python -m unittest discover -s hyperliquid_bot -p test_bot.py -v
      - run: sh -n hyperliquid_bot/start-termux.sh
