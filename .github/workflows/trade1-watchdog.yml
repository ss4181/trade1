name: Trade1 tablet watchdog

# Tablet susarsa Telegram'dan haber verir. Binance'e HIC dokunmaz — yalnizca
# botun gh-pages'e yayimladigi data.json'u okur. Bu yuzden IP yasagi riski yok
# ve tarama isiyle yarismaz.
#
# ONEMLI SERH: GitHub zamanlanmis is akislarini yogunlukta DUSURUR. Olculdu
# (2026-08): "*/5" tanimli tarayici gunde yalnizca 4-16 kez kostu. Bu yuzden
# "1 saat" esigi, uyarinin 1 saat icinde gelecegi anlamina GELMEZ; pratikte
# tespit gecikmesi 1-3 saattir. Yine de 3 gunluk sessizlige gore olcusuz
# iyilesme saglar.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Mesaj gonderme, yalnizca ne yapacagini yaz
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: trade1-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_BOT_ID }}
      WATCHDOG_MAX_AGE_MIN: "60"
      WATCHDOG_REALERT_HOURS: "6"
    steps:
      - name: Bekci kodunu al
        uses: actions/checkout@v6

      - name: Pano verisini al (gh-pages)
        uses: actions/checkout@v6
        continue-on-error: true          # branch henuz yoksa sessiz kal
        with:
          ref: gh-pages
          path: gh-pages

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Bagimliliklar (yalnizca requests)
        run: python -m pip install -r requirements.txt

      - name: Bekci durumunu geri yukle
        uses: actions/cache@v4
        with:
          path: .watchdog_state.json
          key: trade1-watchdog-${{ github.run_id }}
          restore-keys: |
            trade1-watchdog-

      - name: Tabletin son taramasini kontrol et
        run: |
          if [ ! -f gh-pages/data.json ]; then
            echo "gh-pages/data.json yok — yayin kurulu degil, sessiz kaliniyor"
            exit 0
          fi
          python watchdog.py --data gh-pages/data.json \
            --state .watchdog_state.json \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
