name: tests

on:
  push:
    branches-ignore: [gh-pages, trade1-data]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Running tests/file.py puts tests/, not the repository root, on sys.path.
      # Match the local isolated runner's explicit import path on Linux too.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          # server_tests.py FastAPI'yi import ettigi icin CI'da sunucu katmani
          # da kurulur; tablet/bulut yalnizca requirements.txt ile calisir.
          python -m pip install -r requirements-test.txt

      - name: Python sözdizimi
        run: |
          python -m py_compile signal_bot.py server.py watchdog.py \
            cloud_report.py qc_export.py research_monitor.py \
            shadow_experiments.py derivatives_archive.py archive_backup.py \
            notification_delivery.py signal_outcomes.py backup_verify.py cloud_standby.py \
            strategy_engine.py paper_execution.py \
            research/*.py tests/*.py

      - name: Bot çevrimdışı testleri
        run: |
          python -B tests/offline_tests.py
          python -B tests/test_cloud_report.py
          python -B tests/test_watchdog.py
          python -B tests/test_archive_backup.py
          python -B tests/test_shadow_experiments.py
          python -B tests/test_derivatives_archive.py
          python -B tests/test_price_target_analytics.py
          python -B tests/test_research_weekly_delivery.py
          python -B tests/test_forward_oi_periodic_report.py
          python -B tests/test_research_monitor.py
          python -B tests/test_reliability.py
          python -B tests/test_hardening.py
          python -B tests/test_strategy_engine.py
          python -B tests/test_paper_execution.py
          python -B tests/test_evidence_summary.py
          python -B tests/test_paper_report.py

      - name: Pano JavaScript sözdizimi
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import signal_bot
          html = signal_bot.dashboard_html("https://example.invalid/data.json")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path(os.environ["RUNNER_TEMP"], "dashboard.js").write_text(
              script, encoding="utf-8")
          PY
          node --check "${{ runner.temp }}/dashboard.js"
          node tests/test_dashboard.js

      - name: Sunucu readiness testleri
        run: python -B tests/server_tests.py

      - name: QC export testleri
        run: python -B tests/test_qc_export.py

      - name: QC export CLI dumani
        # signals.log gitignored oldugu icin CI'da yok: sentetik girdi uret.
        run: |
          python - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          sig = {"strategy": "S1", "symbol": "BTCUSDT", "direction": "LONG",
                 "bar_time": "2026-01-02T00:00:00+00:00", "price": 100.0,
                 "horizon_hours": 24, "confidence": "YUKSEK",
                 "strength": "NORMAL"}
          (tmp / "smoke-signals.log").write_text(
              json.dumps(sig) + "\n", encoding="utf-8")
          PY
          python -B qc_export.py -l "${{ runner.temp }}/smoke-signals.log" \
            -o "${{ runner.temp }}/qc_smoke"
          test -f "${{ runner.temp }}/qc_smoke/signal_events.csv"

      - name: Araştırma metodoloji testleri
        working-directory: research
        run: python -B -m unittest -v test_methodology.py

      - name: Araştırma evreni / OI / gölge testleri
        run: |
          python -B tests/test_s2_long_short.py
          python -B tests/test_forward_oi_explore.py
          python -B tests/test_forward_oi_barriers.py
          python -B tests/test_g1_liquidation_proxy.py
          python -B tests/test_archive_preparation.py

      - name: Termux betiği sözdizimi
        run: sh -n termux/boot-signal-bot.sh
