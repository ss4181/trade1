name: tests

on:
  push:
    branches-ignore: [gh-pages, trade1-data]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Running tests/file.py puts tests/, not the repository root, on sys.path.
      # Match the local isolated runner's explicit import path on Linux too.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          # server_tests.py FastAPI'yi import ettigi icin CI'da sunucu katmani
          # da kurulur; tablet/bulut yalnizca requirements.txt ile calisir.
          python -m pip install -r requirements-test.txt

      - name: Python sözdizimi
        run: |
          python -m py_compile signal_bot.py server.py watchdog.py \
            cloud_report.py qc_export.py research_monitor.py \
            shadow_experiments.py derivatives_archive.py archive_backup.py \
            notification_delivery.py signal_outcomes.py backup_verify.py cloud_standby.py \
            strategy_engine.py paper_execution.py \
            research/*.py tests/*.py

      - name: Bot çevrimdışı testleri
        # Includes server/QC/research suites in a clean temporary copy with
        # Telegram/publishing disabled and socket connections blocked.
        run: python -B tests/run_isolated.py

      - name: Pano JavaScript sözdizimi
        run: |
          node tests/check_dashboard_js.js
          node tests/test_dashboard.js

      - name: QC export CLI dumani
        # signals.log gitignored oldugu icin CI'da yok: sentetik girdi uret.
        run: |
          python - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          sig = {"strategy": "S1", "symbol": "BTCUSDT", "direction": "LONG",
                 "bar_time": "2026-01-02T00:00:00+00:00", "price": 100.0,
                 "horizon_hours": 24, "confidence": "YUKSEK",
                 "strength": "NORMAL"}
          (tmp / "smoke-signals.log").write_text(
              json.dumps(sig) + "\n", encoding="utf-8")
          PY
          python -B qc_export.py -l "${{ runner.temp }}/smoke-signals.log" \
            -o "${{ runner.temp }}/qc_smoke"
          test -f "${{ runner.temp }}/qc_smoke/signal_events.csv"

      - name: Termux betiği sözdizimi
        run: sh -n termux/boot-signal-bot.sh
